version: '3.8'

# Clinical System - Docker Compose Configuration
# All services run locally for development
# Use docker-compose.prod.yml overrides for production

services:
  # ============================================================================
  # DATABASE
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: clinical-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: clinical_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # CACHE
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: clinical-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # OBJECT STORAGE
  # ============================================================================
  
  minio:
    image: minio/minio:latest
    container_name: clinical-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # BACKEND API
  # ============================================================================
  
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: clinical_db
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-clinical-data}
      MINIO_USE_SSL: "false"
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Elasticsearch (optional logging)
      ELASTICSEARCH_HOST: elasticsearch:9200
      
      # Sentry (optional error tracking)
      SENTRY_DSN: ${SENTRY_DSN:-}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    ports:
      - "3000:3000"
    
    volumes:
      - ./backend:/app
      - /app/node_modules
    
    command: npm run dev
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND
  # ============================================================================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinical-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      VITE_JITSI_DOMAIN: ${VITE_JITSI_DOMAIN:-meet.jit.si}
    
    ports:
      - "5173:5173"
    
    volumes:
      - ./frontend:/app
      - /app/node_modules
    
    command: npm run dev
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # REVERSE PROXY
  # ============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: clinical-nginx
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - api
      - frontend
    
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # LOGGING & OBSERVABILITY
  # ============================================================================
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: clinical-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clinical-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: clinical-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - clinical-network
    restart: unless-stopped

  # ============================================================================
  # METRICS & MONITORING
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: clinical-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - clinical-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: clinical-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - clinical-network
    restart: unless-stopped

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  clinical-network:
    driver: bridge
